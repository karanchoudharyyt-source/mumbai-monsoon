<script type="module">
import * as THREE from 'three';

// Cinematic mode (?demo) renders deterministic frames on demand via window.renderAt(t).

function mulberry(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = mulberry(20261005);
const rand = (a = 0, b = 1) => a + (b - a) * R();
const pick = (a) => a[Math.floor(R() * a.length)];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (u) => { u = clamp(u); return u * u * (3 - 2 * u); };
const ease = (u) => { u = clamp(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };

const RH = 7;            // road half width
const SW = 3;            // sidewalk width

const CROSS = [175, 365, 565, 770];
const nearCross = (z, pad) => CROSS.some((c) => Math.abs(z - c) < pad);

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

const GLOW = canvasTex(128, 128, (g, w) => {
  const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)');
  r.addColorStop(0.25, 'rgba(255,255,255,0.45)');
  r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, w);
});

// Merge static geometry by material so the whole street costs a few dozen draw calls.
const buckets = new Map();
function addGeo(key, mat, geo) {
  if (!buckets.has(key)) buckets.set(key, { mat, geos: [] });
  buckets.get(key).geos.push(geo);
}
function flushBuckets(parent = scene) {
  for (const { mat, geos } of buckets.values()) {
    const indexed = geos.filter((g) => g.index), plain = geos.filter((g) => !g.index);
    for (const list of [indexed, plain]) {
      if (!list.length) continue;
      const mesh = new THREE.Mesh(mergeGeometries(list), mat);
      mesh.matrixAutoUpdate = false;
      mesh.layers.set(mat.userData.layer || 0);
      parent.add(mesh);
    }
  }
  buckets.clear();
}
function scaleUV(g, rx, ry) {
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * rx, uv.getY(i) * ry);
}
function setFaceUV(g, face, u, v) {
  const uv = g.attributes.uv;
  for (let i = face * 4; i < face * 4 + 4; i++) uv.setXY(i, u, v);
}

// Additive light decals (lamp pools, wet-road reflections) merged into one mesh.
const decalPos = [], decalCol = [], decalUV = [], decalIdx = [];
function decal(x, y, z, sx, sz, color, alpha) {
  const c = new THREE.Color(color).multiplyScalar(alpha);
  const base = decalPos.length / 3;
  const pts = [[-sx / 2, -sz / 2], [sx / 2, -sz / 2], [sx / 2, sz / 2], [-sx / 2, sz / 2]];
  const uvs = [[0, 0], [1, 0], [1, 1], [0, 1]];
  pts.forEach(([dx, dz], i) => {
    decalPos.push(x + dx, y, z + dz);
    decalCol.push(c.r, c.g, c.b);
    decalUV.push(...uvs[i]);
  });
  decalIdx.push(base, base + 2, base + 1, base, base + 3, base + 2);
}
function flushDecals(parent = scene) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(decalPos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(decalCol, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(decalUV, 2));
  g.setIndex(decalIdx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    map: GLOW, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, fog: true,
  }));
  m.renderOrder = 2;
  m.layers.set(1);
  parent.add(m);
}

const spriteMats = new Map();
function glow(parent, color, size, x, y, z, intensity = 1) {
  const key = color + ':' + intensity;
  if (!spriteMats.has(key)) {
    spriteMats.set(key, new THREE.SpriteMaterial({
      map: GLOW, color: new THREE.Color(color).multiplyScalar(intensity),
      blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
    }));
  }
  const s = new THREE.Sprite(spriteMats.get(key));
  s.scale.set(size, size, 1);
  s.position.set(x, y, z);
  parent.add(s);
  return s;
}
// ---------------------------------------------------------------- facades
const WALLS = ['#8c8273', '#78868c', '#9d8b7b', '#6f7a88', '#a08b8a', '#7e8a76', '#8b7f99', '#9b9282', '#b0a48f', '#6d7f7a'];
const WIN_LIT = ['#ffcf8a', '#ffd9a8', '#e9f3ff', '#c4ffe4', '#ffc070', '#fff1c9'];
const CURTAINS = ['#c0392b', '#2e86c1', '#d4ac0d', '#7d3c98', '#1e8449', '#e67e22'];

function makeFacade() {
  const S = 512, cols = 4, rows = 4, cw = S / cols, ch = S / rows;
  const wall = pick(WALLS);
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    cells.push({
      r, c, lit: R() < 0.42, col: pick(WIN_LIT), curtain: R() < 0.5 ? pick(CURTAINS) : null,
      ac: R() < 0.35, bal: R() < 0.4, cut: rand(0.2, 0.8), tv: R() < 0.12,
    });
  }
  const rect = (k) => [k.c * cw + cw * 0.18, k.r * ch + ch * 0.22, cw * 0.64, ch * 0.52];
  const stains = Array.from({ length: 36 }, () => [rand(0, S), rand(4, 26), rand(0, S * 0.6)]);
  const map = canvasTex(S, S, (g) => {
    g.fillStyle = wall; g.fillRect(0, 0, S, S);
    for (const [x, w, y0] of stains) {
      const grd = g.createLinearGradient(0, y0, 0, S);
      grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(15,15,15,0.42)');
      g.fillStyle = grd; g.fillRect(x, 0, w, S);
    }
    g.fillStyle = 'rgba(0,0,0,0.28)';
    for (let r = 0; r < rows; r++) g.fillRect(0, r * ch + ch - 9, S, 9);
    for (const k of cells) {
      const [x, y, w, h] = rect(k);
      g.fillStyle = '#23262d'; g.fillRect(x - 5, y - 5, w + 10, h + 10);
      g.fillStyle = k.lit ? k.col : '#11151d'; g.fillRect(x, y, w, h);
      if (k.lit && k.curtain) { g.globalAlpha = 0.75; g.fillStyle = k.curtain; g.fillRect(x, y, w * k.cut, h); g.globalAlpha = 1; }
      if (k.lit && k.tv) { g.fillStyle = '#6fa8ff'; g.fillRect(x + w * 0.6, y + h * 0.35, w * 0.25, h * 0.3); }
      g.strokeStyle = 'rgba(25,25,25,0.95)'; g.lineWidth = 3;
      for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(x + (w * i) / 4, y); g.lineTo(x + (w * i) / 4, y + h); g.stroke(); }
      g.beginPath(); g.moveTo(x, y + h / 2); g.lineTo(x + w, y + h / 2); g.stroke();
      if (k.ac) { g.fillStyle = '#b5b8bc'; g.fillRect(x + w * 0.55, y + h + 7, w * 0.4, ch * 0.12); g.fillStyle = '#6c6c6c'; g.fillRect(x + w * 0.6, y + h + 11, w * 0.3, ch * 0.05); }
      if (k.bal) { g.strokeStyle = '#2f3033'; g.lineWidth = 4; g.strokeRect(x - 9, y + h * 0.6, w + 18, h * 0.4 + 7); }
    }
  });
  const emi = canvasTex(S, S, (g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
    for (const k of cells) {
      if (!k.lit) continue;
      const [x, y, w, h] = rect(k);
      g.fillStyle = k.col; g.fillRect(x, y, w, h);
      if (k.curtain) { g.globalAlpha = 0.6; g.fillStyle = '#000'; g.fillRect(x, y, w * k.cut, h); g.globalAlpha = 1; }
      g.strokeStyle = '#000'; g.lineWidth = 3;
      for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(x + (w * i) / 4, y); g.lineTo(x + (w * i) / 4, y + h); g.stroke(); }
      g.beginPath(); g.moveTo(x, y + h / 2); g.lineTo(x + w, y + h / 2); g.stroke();
    }
  });
  for (const t of [map, emi]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return new THREE.MeshStandardMaterial({ map, emissiveMap: emi, emissive: 0xffffff, emissiveIntensity: 1.7, roughness: 0.92 });
}
const FACADE_MATS = Array.from({ length: 10 }, makeFacade);

// ---------------------------------------------------------------- shopfronts
const PRODUCT = ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#e67e22', '#9b59b6', '#ecf0f1', '#ff6fa8'];
function makeShopfront(kind) {
  const w = 512, h = 320;
  const tex = canvasTex(w, h, (g) => {
    if (kind === 'shutter' || kind === 'half') {
      g.fillStyle = '#4a4d52'; g.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 9) { g.fillStyle = y % 18 ? '#5b5f65' : '#3c3f44'; g.fillRect(0, y, w, 4); }
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(0, h - 26, w, 26);
      if (kind === 'shutter') return;
    }
    const top = kind === 'half' ? h * 0.42 : 0;
    const warm = pick(['#ffe2b0', '#fff4dc', '#ffd59a', '#e8f7ff']);
    g.fillStyle = warm; g.fillRect(0, top, w, h - top);
    for (let row = 0; row < 4; row++) {
      const y = top + 18 + row * ((h - top - 90) / 4);
      if (y > h - 90) break;
      g.fillStyle = '#6b4a2c'; g.fillRect(10, y + 30, w - 20, 5);
      for (let x = 16; x < w - 26; x += rand(14, 30)) {
        g.fillStyle = pick(PRODUCT); g.fillRect(x, y + rand(4, 14), rand(9, 22), 30 - rand(0, 10));
      }
    }
    g.fillStyle = '#5a3b22'; g.fillRect(0, h - 70, w, 70);
    g.fillStyle = '#7a5532'; g.fillRect(0, h - 74, w, 8);
    if (R() < 0.7) {
      const px = rand(80, w - 120);
      g.fillStyle = '#2b2018';
      g.beginPath(); g.arc(px, h - 112, 17, 0, Math.PI * 2); g.fill();
      g.fillRect(px - 26, h - 94, 52, 40);
    }
    const bulb = g.createRadialGradient(w / 2, top + 10, 0, w / 2, top + 10, 140);
    bulb.addColorStop(0, 'rgba(255,255,255,0.9)'); bulb.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = bulb; g.fillRect(0, top, w, h - top);
  });
  return new THREE.MeshStandardMaterial({
    map: tex, emissiveMap: tex, emissive: 0xffffff,
    emissiveIntensity: kind === 'shutter' ? 0.08 : 1.15, roughness: 0.8,
  });
}
const SHOPFRONT_MATS = ['open', 'open', 'open', 'half', 'open', 'shutter', 'half', 'open'].map(makeShopfront);

const SIGN_TEXT = [

];

  { t: 'BUILT WITH DROID', bg: '#0b0b10', fg: '#ff7a1a' },
  { t: 'MONSOON SALE 50% OFF', bg: '#d81b60', fg: '#ffffff' },
  { t: 'CUTTING CHAI · ₹15', bg: '#ffd23d', fg: '#3a1d00' },

const BOARD = [['#c62828', '#ffffff'], ['#1565c0', '#ffeb3b'], ['#2e7d32', '#ffffff'], ['#f9a825', '#3e2723'], ['#ad1457', '#ffffff'], ['#00838f', '#ffffff']];
const signColors = [];
const ATLAS = canvasTex(2048, 2048, (g) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, 2048, 2048);
  for (let i = 0; i < 64; i++) {
    const x = (i % 4) * 512, y = Math.floor(i / 4) * 128;

    signColors[i] = neon || bb ? fg : bg;
    g.fillStyle = bg; g.fillRect(x + 4, y + 4, 504, 120);

    g.fillStyle = fg; g.fillText(text, x + 256, y + 66);
    g.shadowBlur = 0;

let signCursor = 0;

const TARPS = [0x1f5fbf, 0x2a7de1, 0x1a8f5a, 0xc0392b, 0xe0a100].map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, side: THREE.DoubleSide }));

const city = new THREE.Group();
scene.add(city);
const FOG_D = { value: scene.fog.density };
const CW = 8;                       // cross street half width
const SHOP_H = 4.4, FLOOR_H = 3.2;
const SEGS = [];
{ let a = 0; for (const c of CROSS) { SEGS.push([a, c - CW]); a = c + CW; } SEGS.push([a, LEN]); }

function box(mat, key, sx, sy, sz, x, y, z, ry = 0) {
  const g = new THREE.BoxGeometry(sx, sy, sz);
  if (ry) g.rotateY(ry);
  g.translate(x, y, z);
  addGeo(key, mat, g);
  return g;
}
function plane(mat, key, w, h, x, y, z, ry = 0, rx = 0) {
  const g = new THREE.PlaneGeometry(w, h);
  if (rx) g.rotateX(rx);
  if (ry) g.rotateY(ry);
  g.translate(x, y, z);
  addGeo(key, mat, g);
  return g;
}
function quad(mat, key, p0, p1, p2, p3) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([...p0, ...p1, ...p2, ...p3], 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 1, 1, 1, 0, 0, 0], 2));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  g.computeVertexNormals();

  css.textContent = `
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .tb { position: fixed; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
      border-radius: 50%; background: rgba(8,10,14,.5); border: 2px solid rgba(255,194,26,.75);
      color: #fff; font: bold 13px Arial, sans-serif; letter-spacing: 1px; }
    .tb.on { background: rgba(255,194,26,.6); color: #111; }
    .tb.pill { border-radius: 18px; width: 64px; height: 34px; font-size: 12px; top: calc(12px + env(safe-area-inset-top)); }
    @media (orientation: portrait) { .tb.pill { top: calc(104px + env(safe-area-inset-top)); } }`;
  document.head.appendChild(css);
  const B = 'calc(18px + env(safe-area-inset-bottom))', L = 'env(safe-area-inset-left)', Rt = 'env(safe-area-inset-right)';
  const buttons = [
    ['◀', 'KeyA', `left:calc(16px + ${L});bottom:${B};width:78px;height:78px;font-size:26px`],
    ['▶', 'KeyD', `left:calc(106px + ${L});bottom:${B};width:78px;height:78px;font-size:26px`],
    ['GAS', 'KeyW', `right:calc(16px + ${Rt});bottom:${B};width:94px;height:94px;font-size:16px`],
    ['BRAKE', 'KeyS', `right:calc(122px + ${Rt});bottom:${B};width:70px;height:70px;font-size:11px`],
    ['HORN', 'KeyH', `right:calc(30px + ${Rt});bottom:calc(126px + env(safe-area-inset-bottom));width:66px;height:66px;font-size:11px`],
    ['CAM', 'KeyC', 'left:calc(50% - 70px)', 'pill'],
    ['AUTO', 'KeyP', 'left:calc(50% + 6px)', 'pill'],
  ];
  for (const [label, code, pos, cls] of buttons) {
    const b = document.createElement('div');
    b.className = cls ? `tb ${cls}` : 'tb';
    b.textContent = label;
    b.style.cssText = pos;
    const release = () => { keys[code] = false; if (code !== 'KeyP') b.classList.remove('on'); };
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      b.setPointerCapture(e.pointerId);
      press(code);
      b.classList.toggle('on', code === 'KeyP' ? autoMode : true);
    });
    b.addEventListener('pointerup', release);
    b.addEventListener('pointercancel', release);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
    document.body.appendChild(b);
  }
}
addEventListener('resize', () => {
  if (DEMO) return;
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H); composer.setSize(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  hud.width = W; hud.height = H;
  RAIN_U.res.value.set(W, H); grade.uniforms.res.value.set(W, H);
});
const camSm = { pos: new THREE.Vector3(), look: new THREE.Vector3(), init: false };
function gameCamera(dt) {
  const p = player, fx = Math.sin(p.cyaw), fz = Math.cos(p.cyaw);
  let pos, look, fov;
  if (camMode === 1) { pos = rideCam(0, 1.48, 0.36); look = rideCam(0, 0.6, 9); fov = 74; }
  else if (camMode === 2) { pos = V(p.x - 1.9, 0.8, p.z + 7.6); look = V(p.x - 0.15, 1.05, p.z + 0.2); fov = 30; }
  else { pos = V(p.cx - fx * 6.2, 2.45, p.z - fz * 6.2); look = V((p.x + p.cx) / 2 + fx * 8, 1.15, p.z + fz * 8); fov = 52 + p.v * 0.35; }
  if (camera.aspect < 1 && camMode !== 1) fov = Math.min(95, fov * (1 + 0.6 * (1 - camera.aspect)));
  if (!camSm.init || camMode) { camSm.pos.copy(pos); camSm.look.copy(look); camSm.init = camMode === 0; }
  const prev = camSm.pos.clone();
  camSm.pos.lerp(pos, 1 - Math.exp(-dt * 12)); camSm.look.lerp(look, 1 - Math.exp(-dt * 12));
  camera.position.copy(camSm.pos).add(V(0, p.bump * 0.06 * Math.sin(gameT * 40), 0));
  camera.lookAt(camSm.look);
  camera.fov = fov; camera.updateProjectionMatrix();
  return camSm.pos.clone().sub(prev).multiplyScalar(1 / Math.max(dt, 1e-3));
}
let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  gameT += dt; acc += dt;
  while (acc >= 1 / SIM) {
    const inp = autoMode ? autopilot(1 / SIM) : {
      throttle: keys.KeyW || keys.ArrowUp ? 1 : 0, brake: keys.KeyS || keys.ArrowDown ? 1 : 0,
      steer: (keys.KeyA || keys.ArrowLeft ? 1 : 0) - (keys.KeyD || keys.ArrowRight ? 1 : 0),
    };
    if (autoMode && inp.horn && player.horn <= 0) player.horn = 1;
    stepPlayer(1 / SIM, inp); stepTraffic(1 / SIM);
    player.cyaw = lerp(player.cyaw, player.yaw, 3 / SIM);
    player.cx = lerp(player.cx, player.x, 4 / SIM);
    acc -= 1 / SIM;
  }
  if (gameT > nextStrike) { strikes.push(gameT); nextStrike = gameT + rand(14, 30); if (audio) setTimeout(() => { audio.tg.gain.setTargetAtTime(0.9, audio.ac.currentTime, 0.05); audio.tg.gain.setTargetAtTime(0, audio.ac.currentTime + 0.6, 0.8); }, 700); }
  placePlayerMesh();
  updateCockpit(gameT);
  const vel = gameCamera(dt);
  applyFlash(lightningLevel(gameT, strikes.slice(-2)));
  updateWorld(gameT, vel);
  composer.render();
  drawHud({ hud: 1, v: player.v, dist: player.dist, horn: player.horn, cards: [{
    text: 'MUMBAI MONSOON', size: 80, track: 12, y: H / Math.min(W, H) * 1080 * 0.39,
    sub: TOUCH ? 'hold GAS to drive · AUTO to cruise' : 'W to drive · P for autopilot · C to change camera',
    subSize: TOUCH ? 40 : 28, a: 1 - smooth((gameT - 3) / 1.5) }] });
  if (audio) {
    const v = Math.abs(player.v);
    audio.eng.frequency.setTargetAtTime(38 + v * 5.5, audio.ac.currentTime, 0.1);
    audio.lfo.frequency.setTargetAtTime(14 + v * 1.6, audio.ac.currentTime, 0.1);
    audio.horn.gain.setTargetAtTime(player.horn > 0.5 || keys.KeyH ? 0.06 : 0, audio.ac.currentTime, 0.02);
  }
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------- boot
initTraffic();
if (DEMO) {
  simulate();
  let tF = 20.6;
  for (const dt of [0, 0.3, -0.3, 0.6, -0.6, 0.9, -0.9, 1.2, -1.2]) {
    const zm = ((P(20.6 + dt).z + 1.5) % LEN + LEN) % LEN;
    if (!nearCross(zm, CW + 18) && !LAMPS.some((l) => Math.abs(l - zm) < 5)) { tF = 20.6 + dt; break; }
  }
  buildFOB(((P(tF).z + 1.5) % LEN + LEN) % LEN);
  finalizeCity();
  shots = buildShots(tF);
  const cap = document.createElement('canvas');
  cap.width = W; cap.height = H;
  const cg = cap.getContext('2d');
  window.demoInfo = { tF, hornTimes, strikes: STRIKES, duration: T_END, fps: FPS, speeds: frames.map((f) => f.p[3]) };
  window.renderAt = (t) => {
    const o = frameAt(t);
    cg.drawImage(renderer.domElement, 0, 0);
    drawHud(o, cg, false);
    return cap.toDataURL('image/jpeg', 0.92);
  };
  window.dbg = (t) => { const sh = shotAt(t); const f = frames[clamp(Math.round(t * FPS), 0, frames.length - 1)]; return { hud: sh.hud, t0: sh.s.t0, t1: sh.s.t1, dist: f.p[8], z: f.p[1], v: f.p[3], n: frames.length, shots: shots.map((s) => [s.t0, s.t1, s.hud]) }; };
  window.dev = { P, traffic, restore, frames, TYPES, player };
  // reports frames where a shot's camera ends up inside a traffic vehicle
  window.camCheck = () => {
    const bad = [];
    for (let i = 0; i < frames.length; i++) {
      const t = i / FPS; restore(frames[i]);
      const c = shotAt(t).pos;
      for (const v of traffic) {
        const T = TYPES[v.type], hgt = v.type === 'bus' ? 4.6 : v.type === 'truck' ? 3.4 : 1.9;
        if (Math.abs(c.x - v.x) < T.m.wid / 2 + 0.3 && Math.abs(c.z - v.z) < T.m.len / 2 + 0.3 && c.y < hgt) bad.push([+t.toFixed(2), v.type]);
      }
    }
    return bad;
  };
  hud.remove();
  window.ready = true;
} else {
  buildFOB(470);
  finalizeCity();
  player.cyaw = 0; player.cx = player.x;
  requestAnimationFrame(loop);
}
</script>
